<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ثبت‌نام در Nexora">
<title>Nexora | ثبت‌نام</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Vazirmatn,Tahoma,sans-serif;
    color:#f5f7ff;
    background:
        radial-gradient(circle at 20% 20%,rgba(118,87,255,.18),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(25,211,174,.10),transparent 30%),
        #070a11;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:min(470px,100%);
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:white;
    text-decoration:none;
    font-size:24px;
    font-weight:900;
    margin-bottom:22px;
}

.logo-icon{
    width:46px;
    height:46px;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:linear-gradient(135deg,#7657ff,#a287ff);
    box-shadow:0 10px 30px rgba(118,87,255,.35);
}

.card{
    padding:30px;
    border-radius:25px;
    background:rgba(16,21,32,.88);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:28px;
    margin-bottom:8px;
}

.header p{
    color:#9aa6b8;
    font-size:13px;
    line-height:1.8;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:7px;
    color:#dce2ed;
}

input{
    width:100%;
    padding:13px 14px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    background:#0c111a;
    color:white;
    font-family:inherit;
    font-size:13px;
    transition:.25s;
}

input:focus{
    border-color:#7657ff;
    box-shadow:0 0 0 3px rgba(118,87,255,.10);
}

input::placeholder{
    color:#596577;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-left:48px;
}

.show-password{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#8995a8;
    cursor:pointer;
    font-size:17px;
}

.terms{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin:18px 0;
    color:#8995a8;
    font-size:11px;
    line-height:1.8;
}

.terms input{
    width:16px;
    height:16px;
    margin-top:3px;
    accent-color:#7657ff;
}

.terms a{
    color:#a895ff;
    text-decoration:none;
}

.submit{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    color:white;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,#7657ff,#9a7dff);
    box-shadow:0 12px 30px rgba(118,87,255,.22);
    transition:.25s;
}

.submit:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(118,87,255,.32);
}

.message{
    display:none;
    margin-bottom:15px;
    padding:12px;
    border-radius:12px;
    font-size:12px;
    text-align:center;
}

.message.error{
    display:block;
    color:#ffb5b5;
    background:rgba(255,70,70,.08);
    border:1px solid rgba(255,70,70,.15);
}

.message.success{
    display:block;
    color:#83ead7;
    background:rgba(25,211,174,.08);
    border:1px solid rgba(25,211,174,.15);
}

.login{
    text-align:center;
    color:#8995a8;
    font-size:12px;
    margin-top:20px;
}

.login a{
    color:#a895ff;
    font-weight:700;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    color:#687386;
    font-size:11px;
    text-decoration:none;
    margin-top:18px;
}

.back:hover,
.login a:hover{
    color:white;
}

@media(max-width:500px){
    .card{
        padding:23px 18px;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="logo">
    <span class="logo-icon">N</span>
    NEXORA
</a>

<div class="card">

<div class="header">
    <h1>ساخت حساب جدید 🚀</h1>
    <p>
        به Nexora بپیوند و وارد بازار خدمات و محصولات دیجیتال شو.
    </p>
</div>

<div id="message" class="message"></div>

<form id="registerForm">

<div class="form-group">
    <label for="name">نام و نام خانوادگی</label>
    <input
        id="name"
        type="text"
        placeholder="مثلاً علی احمدی"
        autocomplete="name"
        required
    >
</div>

<div class="form-group">
    <label for="username">نام کاربری</label>
    <input
        id="username"
        type="text"
        placeholder="مثلاً alisan"
        autocomplete="username"
        required
    >
</div>

<div class="form-group">
    <label for="email">ایمیل</label>
    <input
        id="email"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
    >
</div>

<div class="form-group">
    <label for="password">رمز عبور</label>

    <div class="password-box">

        <input
            id="password"
            type="password"
            placeholder="حداقل ۸ کاراکتر"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button
            type="button"
            class="show-password"
            onclick="togglePassword('password',this)"
        >
            👁️
        </button>

    </div>
</div>

<div class="form-group">
    <label for="confirmPassword">تکرار رمز عبور</label>

    <div class="password-box">

        <input
            id="confirmPassword"
            type="password"
            placeholder="رمز عبور را دوباره وارد کنید"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button
            type="button"
            class="show-password"
            onclick="togglePassword('confirmPassword',this)"
        >
            👁️
        </button>

    </div>
</div>

<label class="terms">
    <input id="terms" type="checkbox" required>

    <span>
        با
        <a href="#" onclick="return false">قوانین</a>
        و
        <a href="#" onclick="return false">حریم خصوصی</a>
        Nexora موافقم.
    </span>
</label>

<button class="submit" type="submit">
    ساخت حساب Nexora ✨
</button>

</form>

<div class="login">
    قبلاً حساب ساخته‌ای؟
    <a href="login.html">ورود به حساب</a>
</div>

<a href="index.html" class="back">
    ← بازگشت به صفحه اصلی
</a>

</div>

</div>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}

function togglePassword(id,button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        button.textContent = "🙈";

    }else{

        input.type = "password";
        button.textContent = "👁️";

    }

}

form.addEventListener("submit",function(event){

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if(password.length < 8){

        showMessage(
            "رمز عبور باید حداقل ۸ کاراکتر باشد.",
            "error"
        );

        return;
    }

    if(password !== confirmPassword){

        showMessage(
            "رمزهای عبور یکسان نیستند.",
            "error"
        );

        return;
    }

    const users =
        JSON.parse(
            localStorage.getItem("nexora_users") || "[]"
        );

    const exists =
        users.some(function(user){

            return user.email.toLowerCase() ===
                email.toLowerCase()
                ||
                user.username.toLowerCase() ===
                username.toLowerCase();

        });

    if(exists){

        showMessage(
            "این ایمیل یا نام کاربری قبلاً ثبت شده است.",
            "error"
        );

        return;
    }

    const user = {

        id:
            "NX-" +
            Date.now(),

        name:name,

        username:username,

        email:email,

        password:password,

        role:"user",

        verified:false,

        createdAt:
            new Date().toISOString()

    };

    users.push(user);

    localStorage.setItem(
        "nexora_users",
        JSON.stringify(users)
    );

    localStorage.setItem(
        "nexora_current_user",
        JSON.stringify(user)
    );

    showMessage(
        "حساب شما با موفقیت ساخته شد! 🎉",
        "success"
    );

    setTimeout(function(){

        window.location.href = "profile.html";

    },1200);

});

</script>

</body>
  </html>
